<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情绪宝 · Emo Treasure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div id="toast_bar" class="toast-bar"></div>

    <button class="lang-switch" id="lang_switch">中 / EN</button>

    <div id="welcome_layer" class="layer active">
        <div class="login-container">
            <div class="logo-block">
                <div class="logo-cn">情绪宝</div>
                <div class="logo-en">Emo Treasure</div>
            </div>
            <div class="welcome-text" id="welcome_text"></div>
            <div class="welcome-buttons">
                <button class="btn-primary" id="btn_welcome_agree">同意</button>
                <button class="btn-secondary" id="btn_welcome_disagree">不同意</button>
            </div>
        </div>
    </div>

    <div id="login_layer" class="layer">
        <div class="login-container">
            <div class="logo-block">
                <div class="logo-cn">情绪宝</div>
                <div class="logo-en">Emo Treasure</div>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab_login">登录</button>
                <button class="auth-tab" id="tab_register">注册</button>
            </div>

            <div id="auth_login_panel" class="auth-panel active">
                <div class="input-group">
                    <input type="text" id="input_login_name" class="input-field" placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="input-group password-wrapper">
                    <input type="password" id="input_login_password" class="input-field" placeholder="请输入密码" autocomplete="current-password">
                    <button type="button" class="password-eye" data-target="input_login_password" aria-label="显示/隐藏密码">
                        <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <div class="status-msg" id="login_status"></div>
                <button class="btn-primary btn-block" id="btn_do_login">登 录</button>
            </div>

            <div id="auth_register_panel" class="auth-panel">
                <div class="input-group">
                    <input type="text" id="input_account" class="input-field" placeholder="请输入手机号或邮箱" autocomplete="username">
                </div>
                <div class="input-group input-group-code">
                    <input type="text" id="input_code" class="input-field" placeholder="请输入验证码" autocomplete="one-time-code">
                    <button class="btn-code" id="btn_get_code">获取验证码</button>
                </div>
                <button class="btn-primary btn-block" id="btn_login">注 册</button>
                <div class="divider"><span>其他注册方式</span></div>
                <div class="alt-buttons">
                    <button class="btn-alt" id="btn_wechat"><span class="icon">💬</span> 微信注册</button>
                    <button class="btn-alt" id="btn_activation"><span class="icon">🔑</span> 激活码</button>
                </div>
            </div>

            <button class="btn-guest" id="btn_guest">👤 访客体验</button>
        </div>
    </div>

    <div id="guest_layer" class="layer">
        <div class="login-container">
            <div class="logo-block">
                <div class="logo-cn">情绪宝</div>
                <div class="logo-en">Emo Treasure</div>
            </div>
            <div class="input-group">
                <input type="text" id="input_guest_name" class="input-field" placeholder="请输入您的名字（必填）" maxlength="20" autocomplete="off">
            </div>
            <button class="btn-primary btn-block" id="btn_guest_confirm">确 认</button>
            <button class="btn-secondary btn-block" id="btn_guest_back">返 回</button>
        </div>
    </div>

    <div id="activation_layer" class="layer">
        <div class="login-container">
            <div class="logo-block">
                <div class="logo-cn">情绪宝</div>
                <div class="logo-en">Emo Treasure</div>
            </div>
            <div class="input-group">
                <input type="text" id="input_activation_code" class="input-field" placeholder="请输入激活码" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="text" id="input_activation_name" class="input-field" placeholder="请输入您的名字（必填）" maxlength="20" autocomplete="off">
            </div>
            <button class="btn-primary btn-block" id="btn_activation_confirm">确 认</button>
            <button class="btn-secondary btn-block" id="btn_activation_back">返 回</button>
            <div class="status-msg" id="activation_status"></div>
        </div>
    </div>

    <div id="password_layer" class="layer">
        <div class="login-container">
            <div class="logo-block">
                <div class="logo-cn">情绪宝</div>
                <div class="logo-en">Emo Treasure</div>
            </div>

            <div class="password-intro" id="password_intro">请设置您的登录密码</div>

            <div class="input-group password-wrapper">
                <input type="password" id="input_new_password" class="input-field" placeholder="请输入密码" autocomplete="new-password">
                <button type="button" class="password-eye" data-target="input_new_password" aria-label="显示/隐藏密码">
                    <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <div class="password-strength-bar">
                <div class="password-strength-fill" id="pwd_strength_fill"></div>
            </div>
            <div class="password-strength-text" id="pwd_strength_text"></div>

            <div class="password-rules" id="password_rules">
                <div>至少 8 位</div>
                <div>包含字母 / 数字 / 大写 / 小写 / 特殊字符（至少 3 类）</div>
            </div>

            <div class="status-msg" id="password_status"></div>

            <button class="btn-primary btn-block" id="btn_password_confirm" disabled>完 成</button>
        </div>
    </div>

    <script src="js/qx00_login.js"></script>
</body>
</html>
